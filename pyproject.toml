[project]
name = "releasing"
version = "1.0.1"
description = "Release helpers for projects that publish from a Git-tracked source tree"
keywords = [
  "release",
  "packaging",
  "pypi",
  "changelog",
  "markdown",
  "versioning"
]
license = "GPL-3.0-or-later"
license-files = ["LICENSES/*.txt"]
readme = {file = "README.md", content-type = "text/markdown"}
authors = [
  { name = "foundata GmbH" },
  { name = "Andreas Haerter", email = "ah@foundata.com" },
]
maintainers = [
  { name = "Andreas Haerter", email = "ah@foundata.com" },
]
requires-python = ">=3.11"
dependencies = [
  # The Markdown adapter uses the parser's rule API (rules_inline, rules_block
  # and helpers), which is stable across 3.x and 4.x; the next major is
  # excluded until its rule API has been reviewed.
  "markdown-it-py>=3.0,<5",
  "typing-extensions>=4.4",  # `override` backport for Python 3.11.
]

# https://pypi.org/classifiers/
classifiers = [
  "Development Status :: 5 - Production/Stable",

  # Indication for whom the project is for
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Build Tools",
  "Topic :: System :: Software Distribution",

  # Supported Python versions
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.scripts]
release = "releasing.cli:main"

[project.urls]
Homepage = "https://foundata.com/en/projects/releasing/"
Documentation = "https://foundata.com/en/projects/releasing/#doc"
Repository = "https://foundata.com/en/projects/releasing/#source"
Issues = "https://foundata.com/en/projects/releasing/#issues"
Changelog = "https://foundata.com/en/projects/releasing/#changelog"

[tool.releasing]
repository = "foundata/releasing"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  "mypy>=1.17.1",
  "pytest>=9.0",
  "pytest-cov>=6.2.1",
  "readme-renderer[md]>=44",
  "ruff>=0.12.11",
  "rumdl>=0.2.66",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# https://docs.astral.sh/ruff/settings/#lint_select
select = [
  "E4",  # pycodestyle import errors
  "E7",  # pycodestyle statement errors
  "E9",  # pycodestyle runtime errors
  "F",   # Pyflakes
  "I",   # import sorting
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "UP",  # pyupgrade
  "RUF", # Ruff-specific rules
  "A",   # flake8-builtins: no shadowing of Python builtins
  "D",   # pydocstyle: docstrings on public modules, classes and functions
  "DTZ", # flake8-datetimez: timezone-aware datetime handling only
  "G",   # flake8-logging-format: lazy logging arguments, no eager formatting
  "LOG", # flake8-logging: correct use of the logging module
  "N",   # pep8-naming: PEP 8 naming conventions
  "PTH", # flake8-use-pathlib: pathlib instead of os.path
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
  "D", # tests need no docstrings; their names describe the behavior
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"
docstring-code-format = true
docstring-code-line-length = 88

[tool.mypy]
files = ["src", "tests"]
python_version = "3.11"
strict = true
enable_error_code = ["explicit-override"] # Extends strict mode.
warn_unreachable = true                   # Extends strict mode.

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
filterwarnings = ["error"]
strict = true
testpaths = ["tests"]
markers = ["integration: local subprocess and renderer checks; no network"]

# Coverage is measured only for the modules whose tests exercise them in this
# process. The command-line layer and everything that drives Git, uv or a forge
# is tested by running the real command in a subprocess, which coverage cannot
# observe; counting those files would report a number that says nothing about
# how well they are tested. See DEVELOPMENT.md.
[tool.coverage.run]
branch = true
source = ["src/releasing"]
omit = [
  "src/releasing/__main__.py",
  "src/releasing/build.py",
  "src/releasing/cli.py",
  "src/releasing/processes.py",
  "src/releasing/tag.py",
  "src/releasing/verify.py",
]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
